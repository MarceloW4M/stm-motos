services:
  nginx:
    image: nginx:alpine
    container_name: dfs_nginx
    expose:
      - "80"
    volumes:
      - ./src:/var/www/html
      - ./web-stm:/var/www/html/web-stm:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - stm_network
      - web
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: dfssolution.duckdns.org
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: dfssolution.duckdns.org
      LETSENCRYPT_EMAIL: marcelow4mpt@gmail.com

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./src:/var/www/html
    container_name: dfs_php
    networks:
      - stm_network
    restart: unless-stopped
    environment:
      - PHP_MEMORY_LIMIT=256M
      - PHP_MAX_EXECUTION_TIME=120
      - PHP_UPLOAD_MAX_FILESIZE=20M
      - PHP_POST_MAX_SIZE=20M
      - DB_HOST=10.50.0.30
      - DB_PORT=3406
      - DB_NAME=dfs-web
      - DB_USER=stm_app
      - DB_PASS=stm_app_pass
      - API_TOKEN=
      - MCP_AUTH_HEADER=Authorization
      - MCP_AUTH_SCHEME=Bearer

networks:
  stm_network:
    driver: bridge
  web:
    external: true
    name: stm-taller-motos_web
